name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Gradle wrapper
        run: |
          # Move real build script aside; use a placeholder to avoid evaluating
          # version catalog references before the wrapper is generated.
          mv build.gradle.kts build.gradle.kts.bak
          echo '// placeholder' > build.gradle.kts
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle.zip
          ./gradle-8.12/bin/gradle wrapper --gradle-version 8.12
          mv build.gradle.kts.bak build.gradle.kts

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: greenstep-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
